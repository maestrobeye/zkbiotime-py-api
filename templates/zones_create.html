{% extends "base.html" %}

{% block title %}Nouvelle zone{% endblock %}

{% block content %}

<div class="container py-4">
<div class="mx-auto" style="max-width: 700px;">

    <!-- Header -->
    <div class="mb-4">

        <h1 class="fs-2 fw-bold text-dark mb-1">
            Nouvelle zone
        </h1>

        <p class="text-secondary mb-0">
            Ajouter une nouvelle zone
        </p>

    </div>


    <!-- Formulaire -->
    <div class="card border-0 shadow-sm">

        <form method="POST"
              action="/areas/create">

            <div class="card-body p-4 p-md-5">

                <!-- Code -->
                <div class="mb-4">

                    <label for="area_code"
                           class="form-label fw-semibold">

                        Code

                    </label>

                    <input type="text"
                           id="area_code"
                           name="area_code"
                           required
                           class="form-control"
                           placeholder="Ex : Z001">

                </div>


                <!-- Nom -->
                <div class="mb-4">

                    <label for="area_name"
                           class="form-label fw-semibold">

                        Nom

                    </label>

                    <input type="text"
                           id="area_name"
                           name="area_name"
                           required
                           class="form-control"
                           placeholder="Ex : Administration">

                </div>


                <!-- Zone parente -->
                <div class="mb-4">

                    <label for="parent_area"
                           class="form-label fw-semibold">

                        Zone parente

                    </label>

                    <select id="parent_area"
                            name="parent_area"
                            class="form-select">

                        <option value="">
                            Aucune
                        </option>

                        {% for area in areas %}

                        <option value="{{ area.id }}">
                            {{ area.area_name }}
                        </option>

                        {% endfor %}

                    </select>

                    <div class="form-text">
                        Sélectionnez une zone parente si cette zone
                        appartient à une autre zone.
                    </div>

                </div>

            </div>


            <!-- Footer -->
            <div class="card-footer bg-light
                        d-flex justify-content-end
                        gap-2 p-3">

                <a href="/zones"
                   class="btn btn-outline-secondary">

                    Annuler

                </a>

                <button type="submit"
                        class="btn btn-primary">

                    Créer

                </button>

            </div>

        </form>

    </div>

</div>

</div>

{% endblock %}
