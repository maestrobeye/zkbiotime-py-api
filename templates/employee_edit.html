{% extends "base.html" %}

{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-xl-10">
            <!-- Messages -->
            <div id="successMessage" class="alert alert-success d-none mb-4" role="alert">
            </div>

            <div id="errorMessage" class="alert alert-danger d-none mb-4" role="alert">
            </div>

            <!-- Formulaire -->
            <form method="POST" action="/employees/edit/{{ employee.id }}" class="bg-white border rounded-3 shadow-sm">

                <div class="p-4 p-md-5">

                    <!-- Informations professionnelles -->
                    <div class="mb-5">

                        <div class="border-bottom pb-3 mb-4">
                            <h2 class="h5 fw-semibold text-dark mb-1">
                                Informations de l'AGENT
                            </h2>

                            <p class="text-muted small mb-0">
                                Informations professionnelles de l'agent.
                            </p>
                        </div>

                        <div class="row g-4">

                            <!-- Code employé -->
                            <div class="col-12 col-md-6">

                                <label for="emp_code" class="form-label fw-medium">
                                    Matricule
                                </label>

                                <input type="text" id="emp_code" name="emp_code" value="{{ employee.emp_code or '' }}"
                                    required class="form-control">

                            </div>


                            <!-- Numéro de carte -->
                            <div class="col-12 col-md-6">

                                <label for="card_no" class="form-label fw-medium">
                                    Numéro de carte
                                </label>

                                <input type="number" id="card_no" name="card_no" value="{{ employee.card_no or '' }}"
                                    class="form-control">

                            </div>


                            <!-- Fonction -->
                            <div class="col-12 col-md-6">

                                <label for="position" class="form-label fw-medium">
                                    Fonction
                                </label>

                                <input type="text" id="position" name="position"
                                    value="{{ employee.position.position_name or '' }}" required class="form-control">

                            </div>


                            <!-- Zones -->
                            <div class="col-12">

                                <label for="area" class="form-label fw-medium">
                                    Zones
                                </label>

                                <select id="area" name="area" multiple class="form-select" size="5">

                                    {% for a in area.data %}

                                    <option value="{{ a.id }}" {% if a.id in employee_area_ids %}selected{% endif %}>
                                        {{ a.id }} - {{ a.area_name }}
                                    </option>

                                    {% endfor %}

                                </select>

                                <div class="form-text">
                                    Maintenez Ctrl (Windows/Linux) ou Cmd (Mac)
                                    pour sélectionner plusieurs zones.
                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- Informations personnelles -->
                    <div>

                        <div class="border-bottom pb-3 mb-4">
                            <h2 class="h5 fw-semibold text-dark mb-1">
                                Informations personnelles
                            </h2>

                            <p class="text-muted small mb-0">
                                Coordonnées personnelles de l'agent.
                            </p>
                        </div>

                        <div class="row g-4">

                            <!-- Prénom -->
                            <div class="col-12 col-md-6">

                                <label for="first_name" class="form-label fw-medium">
                                    Prénom
                                </label>

                                <input type="text" id="first_name" name="first_name"
                                    value="{{ employee.first_name or '' }}" class="form-control">

                            </div>


                            <!-- Nom -->
                            <div class="col-12 col-md-6">

                                <label for="last_name" class="form-label fw-medium">
                                    Nom
                                </label>

                                <input type="text" id="last_name" name="last_name"
                                    value="{{ employee.last_name or '' }}" class="form-control">

                            </div>


                            <!-- Téléphone -->
                            <div class="col-12 col-md-6">

                                <label for="mobile" class="form-label fw-medium">
                                    Téléphone
                                </label>

                                <input type="tel" id="mobile" name="mobile" value="{{ employee.mobile or '' }}"
                                    class="form-control">

                            </div>


                            <!-- Email -->
                            <div class="col-12 col-md-6">

                                <label for="email" class="form-label fw-medium">
                                    Email
                                </label>

                                <input type="email" id="email" name="email" value="{{ employee.email or '' }}"
                                    class="form-control">

                            </div>

                        </div>

                    </div>

                </div>


                <!-- Footer -->
                <div class="border-top bg-light px-4 px-md-5 py-3">

                    <div class="d-flex justify-content-end gap-2">

                        <a href="/employees" class="btn btn-outline-secondary">
                            Annuler
                        </a>

                        <button type="submit" class="btn btn-primary">
                            Enregistrer
                        </button>

                    </div>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
