<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ZKBioTime RH{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Heroicons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: Inter, Arial, sans-serif;
        }

        .sidebar-link {
            @apply flex items-center gap-3 px-4 py-3 rounded-lg transition;
        }
    </style>

</head>

<body class="bg-gray-100">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <aside class="fixed left-0 top-0 h-screen w-64 bg-slate-900 text-white shadow-xl z-50">
            <div class="h-16 flex items-center justify-center border-b border-slate-800">
                <h1 class="text-2xl font-bold">
                    ZKBioTime RH
                </h1>
            </div>

            <nav class="p-4 space-y-2">

                <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">

                    <i data-lucide="layout-dashboard"></i>

                    Tableau de bord

                </a>

                <a href="/employees" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">

                    <i data-lucide="users"></i>

                    Agents

                </a>

                <a href="/attendance" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">

                    <i data-lucide="clock-3"></i>

                    Pointages

                </a>

                <a href="/zones" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
                    <i data-lucide="file-spreadsheet"></i>
                    Zones
                </a>

                <a href="/pointeurs" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
                    <i data-lucide="file-spreadsheet"></i>
                    Pointeurs
                </a>

            </nav>

            <div class="absolute bottom-0 w-64 border-t border-slate-800 p-4">

                <a href="/logout" class="flex items-center gap-3 text-red-300 hover:text-white">

                    <i data-lucide="log-out"></i>

                    Déconnexion

                </a>

            </div>

        </aside>

        <!-- Contenu -->
        <div class="flex-1 flex flex-col ml-64">
            <!-- Header -->
            <header
                class="fixed top-0 right-0 left-64 z-50 bg-white shadow h-16 flex items-center justify-between px-8">
                <div>
                    <h2 class="font-semibold text-xl text-gray-700">
                        {% block header %}
                        Tableau de bord
                        {% endblock %}
                    </h2>
                </div>

                <div class="flex items-center gap-4">

                    <div class="text-right">

                        <div class="font-semibold">
                            {{ request.session.get("user","RH") }}
                        </div>

                        <div class="text-sm text-gray-500">
                            Ressources Humaines
                        </div>

                    </div>

                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center">

                        {{ request.session.get("user","R")[0]|upper }}

                    </div>

                </div>

            </header>

            <!-- Page -->
            <main class="flex-1 p-8 overflow-y-auto h-screen pt-24">
                {% block content %}
                {% endblock %}

            </main>

        </div>

    </div>
    <script>
        const periode = document.getElementById('periode');
        const startDate = document.getElementById('start_date');
        const endDate = document.getElementById('end_date');

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');

            return `${year}-${month}-${day}`;
        }

        periode.addEventListener('change', function () {
            const today = new Date();

            let start;
            let end;

            switch (this.value) {

                case "Aujourd'hui":
                    start = new Date(today);
                    end = new Date(today);
                    break;

                case "Hier":
                    start = new Date(today);
                    start.setDate(today.getDate() - 1);

                    end = new Date(start);
                    break;

                case "Cette semaine":
                    start = new Date(today);

                    // Lundi = début de semaine
                    const day = today.getDay();
                    const diff = day === 0 ? 6 : day - 1;

                    start.setDate(today.getDate() - diff);

                    end = new Date(start);
                    end.setDate(start.getDate() + 6);
                    break;

                case "Ce mois":
                    start = new Date(
                        today.getFullYear(),
                        today.getMonth(),
                        1
                    );

                    end = new Date(
                        today.getFullYear(),
                        today.getMonth() + 1,
                        0
                    );
                    break;

                case "Cette année":
                    start = new Date(
                        today.getFullYear(),
                        0,
                        1
                    );

                    end = new Date(
                        today.getFullYear(),
                        11,
                        31
                    );
                    break;

                default:
                    return;
            }

            startDate.value = formatDate(start);
            endDate.value = formatDate(end);
        });
    </script>
    <script>
        document.getElementById("exportExcel").addEventListener("click", function (event) {

            event.preventDefault();

            const start = document.getElementById("start_date").value;
            const end = document.getElementById("end_date").value;

            if (!start || !end) {
                alert("Veuillez sélectionner les deux dates.");
                return;
            }

            window.location.href =
                `/attendance/export?start_date=${encodeURIComponent(start)}&end_date=${encodeURIComponent(end)}`;
        });
    </script>
    <script>
        lucide.createIcons();
    </script>
  <script>
    const syncForm = document.getElementById("syncForm");
    const syncBtn = document.getElementById("syncEmployeesBtn");
    const syncText = document.getElementById("syncText");
    const syncIcon = document.getElementById("syncIcon");

    syncForm.addEventListener("submit", function () {

        syncBtn.disabled = true;

        syncText.textContent = "Synchronisation...";
        syncIcon.classList.add("animate-spin");

    });
</script>

</body>

</html>
