{% extends "base.html" %}

{% block title %}Employé{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto p-6">

    <!-- Header -->
    <div class="mb-6">
        <div class="flex items-center gap-3">
            <a
                href="/zones"
                class="text-gray-500 hover:text-gray-700"
            >
                ←
            </a>

            <div>
                <h1 class="text-2xl font-bold text-gray-800">
                    Modifier la zone
                </h1>

                <p class="text-sm text-gray-500 mt-1">
                    Modifier les informations de la zone
                </p>
            </div>
        </div>
    </div>


    <!-- Formulaire -->
    <form
        method="POST"
        action="/areas/edit/{{ area.id }}"
        class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-5"
    >

        <!-- Code -->
        <div>
            <label
                for="area_code"
                class="block text-sm font-medium text-gray-700 mb-2"
            >
                Code de la zone
            </label>

            <input
                type="text"
                id="area_code"
                name="area_code"
                value="{{ area.area_code or '' }}"
                required
                class="w-full rounded-lg border border-gray-300
                       px-3 py-2
                       focus:border-blue-500
                       focus:ring-blue-500"
            >
        </div>


        <!-- Nom -->
        <div>
            <label
                for="area_name"
                class="block text-sm font-medium text-gray-700 mb-2"
            >
                Nom de la zone
            </label>

            <input
                type="text"
                id="area_name"
                name="area_name"
                value="{{ area.area_name or '' }}"
                required
                class="w-full rounded-lg border border-gray-300
                       px-3 py-2
                       focus:border-blue-500
                       focus:ring-blue-500"
            >
        </div>


        <!-- Zone parente -->
        <div>
            <label
                for="parent_area"
                class="block text-sm font-medium text-gray-700 mb-2"
            >
                Zone parente
            </label>

            <select
                id="parent_area"
                name="parent_area"
                class="w-full rounded-lg border border-gray-300
                       px-3 py-2
                       bg-white
                       focus:border-blue-500
                       focus:ring-blue-500"
            >

                <option value="">
                    Aucune
                </option>

                {% for parent in areas %}

                    {% if parent.id != area.id %}

                    <option
                        value="{{ parent.id }}"
                        {% if area.parent_area == parent.id %}
                            selected
                        {% endif %}
                    >
                        {{ parent.area_name }}
                    </option>

                    {% endif %}

                {% endfor %}

            </select>

            <p class="mt-1 text-xs text-gray-500">
                Sélectionnez une zone parente si nécessaire.
            </p>
        </div>


        <!-- Actions -->
        <div class="flex items-center justify-end gap-3 pt-5 border-t">

            <a
                href="/zones"
                class="px-4 py-2 rounded-lg
                       border border-gray-300
                       text-gray-700
                       hover:bg-gray-50"
            >
                Annuler
            </a>

            <button
                type="submit"
                class="px-5 py-2 rounded-lg
                       bg-blue-600
                       text-white
                       font-medium
                       hover:bg-blue-700
                       focus:outline-none
                       focus:ring-2
                       focus:ring-blue-500
                       focus:ring-offset-2"
            >
                Enregistrer
            </button>

        </div>

    </form>

</div>

{% endblock %}
