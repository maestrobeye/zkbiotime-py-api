{% extends "base.html" %}

{% block title %}Modifier la zone{% endblock %}

{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <!-- Header -->
            <div class="mb-4">
                <!-- Formulaire -->
                <form method="POST" action="/areas/edit/{{ area.id }}" class="bg-white border rounded-3 shadow-sm">

                    <div class="p-4">

                        <!-- Code -->
                        <div class="mb-4">

                            <label for="area_code" class="form-label fw-medium">
                                Code de la zone
                            </label>

                            <input type="text" id="area_code" name="area_code" value="{{ area.area_code or '' }}"
                                required class="form-control">

                        </div>


                        <!-- Nom -->
                        <div class="mb-4">

                            <label for="area_name" class="form-label fw-medium">
                                Nom de la zone
                            </label>

                            <input type="text" id="area_name" name="area_name" value="{{ area.area_name or '' }}"
                                required class="form-control">

                        </div>


                        <!-- Zone parente -->
                        <div class="mb-4">

                            <label for="parent_area" class="form-label fw-medium">
                                Zone parente
                            </label>

                            <select id="parent_area" name="parent_area" class="form-select">

                                <option value="">
                                    Aucune
                                </option>

                                {% for parent in areas %}

                                {% if parent.id != area.id %}

                                <option value="{{ parent.id }}" {% if area.parent_area==parent.id %} selected {% endif
                                    %}>
                                    {{ parent.area_name }}
                                </option>

                                {% endif %}

                                {% endfor %}

                            </select>

                            <div class="form-text">
                                Sélectionnez une zone parente si nécessaire.
                            </div>

                        </div>

                    </div>


                    <!-- Actions -->
                    <div class="border-top bg-light p-3">

                        <div class="d-flex justify-content-end gap-2">

                            <a href="/zones" class="btn btn-outline-secondary">
                                Annuler
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Enregistrer
                            </button>

                        </div>

                    </div>

                </form>

            </div>
        </div>

    </div>

    {% endblock %}
